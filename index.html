<main data-page="menu" class="pg-menu">

  <p class="tag">Он идёт к тебе через весь город. У тебя есть кровать, дверь, телефон на последнем издыхании — и очень мало сна.</p>

  <div class="diff">

    <button class="dbtn" data-diff="nightmare"><b>Кошмар</b><span>быстрый, врёт, почти не даёт времени</span></button>

  <div class="menu-btns">
    <button class="btn primary" data-go="start">Начать ночь 1</button>
    <button class="btn" data-go="cont" id="contBtn" hidden>Продолжить с ночи <span id="contN">2</span></button>
    <a class="btn" href="help.html" data-go="help">Как играть</a>
    <a class="btn" href="achievements.html" data-go="ach">Достижения <span id="achCount">0/16</span></a>

  <p class="best" id="bestTxt">Пройдено ночей: 0</p>
